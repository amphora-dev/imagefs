# =============================================================================
# .cnb.yml — winlator bionic imagefs 构建流水线 (CNB 云原生构建)
# =============================================================================
# 仓库: https://cnb.cool/atowerlight/winlator-imagefs
#
# 触发:
#   main.push         完整构建 imagefs + native-libs，产物上传为 commit 附件
#   main.pull_request 仅构建 imagefs 做验证 (不消耗产物配额)
#   $.tag_push        完整构建 + 创建 Release + 上传产物到 Release 附件
#
# 缓存:
#   - NDK r29 (~1.5GB) 与源码包缓存于 /tmp/imagefs-build/cache (跨构建复用)
# =============================================================================

# ---- 可复用的构建环境 (YAML 锚点) ----
.build-env: &build-env
  docker:
    build:
      dockerfile: ci/Dockerfile
      by:
        - ci/Dockerfile
  runner:
    cpus: 4
  env:
    # config.sh 读取的环境变量
    BUILD_DIR: /tmp/imagefs-build
    OUTPUT_DIR: /tmp/imagefs-output
    JOBS: "4"
    # winlator_bionic 源码 (audio_plugin / android_sysvshm 在仓库根目录)
    WINLATOR_DIR: /tmp/winlator-bionic
  # 跨构建增量缓存 (copy-on-write 在流水线成功后合并)。
  # 每个路径用**独立 group 名** (CNB 同 group 多路径会共享一份数据导致冲突!):
  #   ndk-cache    — NDK r29 (~1.5GB) + 源码 tarball
  #   src-tree     — 已解压的源码树 (避免重复解压)
  #   built-marker — 每包 .done marker (内含包脚本 sha256, 脚本变则失效重编)
  #   imagefs-out  — 已安装产物树 (改 1 个包只重编该包, 其余命中缓存)
  # 配合 build-all.sh 的 hash marker + create-rootfs.sh 增量模式, 单包迭代
  # 从 ~14min 降到 ~2min。需干净重建时设 REBUILD_ROOTFS=1。
  volumes:
    - ndk-cache:/tmp/imagefs-build/cache:copy-on-write
    - src-tree:/tmp/imagefs-build/src:copy-on-write
    - built-marker:/tmp/imagefs-build/built-pkgs:copy-on-write
    - imagefs-out:/tmp/imagefs-build/imagefs:copy-on-write

# =============================================================================
# main 分支
# =============================================================================
main:
  # ---- push: 完整构建 + 上传产物 ----
  push:
    - <<: *build-env
      stages:
        - name: 克隆 winlator_bionic 源码
          script: |
            if [ ! -d /tmp/winlator-bionic/.git ]; then
              git clone --depth 1 -b winlator_bionic --recursive \
                https://github.com/Pipetto-crypto/winlator.git /tmp/winlator-bionic
            fi
            # 验证 imagefs 依赖的源码存在
            test -f /tmp/winlator-bionic/audio_plugin/module_pcm_android_aserver.c
            test -f /tmp/winlator-bionic/android_sysvshm/android_sysvshm.c
            echo "winlator_bionic 源码就绪"

        - name: 构建 imagefs (41 个包)
          script: ./build-all.sh
          timeout: 2h

        - name: 验证关键产物
          script: |
            test -f /tmp/imagefs-output/imagefs.txz
            test -x /tmp/imagefs-build/imagefs/usr/bin/box64
            echo "imagefs 构建验证通过"
            ls -lh /tmp/imagefs-output/

        - name: 构建 native-libs (winlator 原生库)
          allowFailure: true
          timeout: 1h
          script: |
            export WINLATOR_SRC=/tmp/winlator-bionic/app/src/main/cpp
            # adrenoutils_extra 需从 APK 资源提取源码，CI 中跳过该单项
            ./build-native-libs.sh adrenotools winlator-native proot virglrenderer

        - name: 收集产物
          script: |
            mkdir -p artifacts
            cp /tmp/imagefs-output/imagefs.txz artifacts/
            cp /tmp/imagefs-output/imagefs.txz.sha256sum artifacts/
            # native-libs 打包 (构建失败则跳过)
            if ls output/native-libs/*.so >/dev/null 2>&1; then
              tar cJf artifacts/native-libs.tar.xz -C output native-libs
            fi
            echo "=== 产物清单 ==="
            ls -lh artifacts/

        - name: 上传产物 (commit 附件)
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - ./artifacts/imagefs.txz
              - ./artifacts/imagefs.txz.sha256sum
              - ./artifacts/native-libs.tar.xz

  # ---- pull_request: 仅验证构建 ----
  pull_request:
    - <<: *build-env
      # PR 只读复用缓存, 不写回 (避免未合并代码污染缓存); group 名须与 main 一致
      volumes:
        - ndk-cache:/tmp/imagefs-build/cache:copy-on-write-read-only
        - src-tree:/tmp/imagefs-build/src:copy-on-write-read-only
        - built-marker:/tmp/imagefs-build/built-pkgs:copy-on-write-read-only
        - imagefs-out:/tmp/imagefs-build/imagefs:copy-on-write-read-only
      stages:
        - name: 克隆 winlator_bionic 源码
          script: |
            if [ ! -d /tmp/winlator-bionic/.git ]; then
              git clone --depth 1 -b winlator_bionic --recursive \
                https://github.com/Pipetto-crypto/winlator.git /tmp/winlator-bionic
            fi
            test -f /tmp/winlator-bionic/audio_plugin/module_pcm_android_aserver.c
            test -f /tmp/winlator-bionic/android_sysvshm/android_sysvshm.c
        - name: 构建 imagefs (验证)
          script: ./build-all.sh
          timeout: 2h
        - name: 验证关键产物
          script: |
            test -f /tmp/imagefs-output/imagefs.txz
            test -x /tmp/imagefs-build/imagefs/usr/bin/box64
            echo "imagefs 构建验证通过"

# =============================================================================
# tag 推送: 构建 + 发布 Release
# =============================================================================
$:
  tag_push:
    - <<: *build-env
      stages:
        - name: 克隆 winlator_bionic 源码
          script: |
            if [ ! -d /tmp/winlator-bionic/.git ]; then
              git clone --depth 1 -b winlator_bionic --recursive \
                https://github.com/Pipetto-crypto/winlator.git /tmp/winlator-bionic
            fi
            test -f /tmp/winlator-bionic/audio_plugin/module_pcm_android_aserver.c
            test -f /tmp/winlator-bionic/android_sysvshm/android_sysvshm.c

        - name: 构建 imagefs (41 个包)
          script: ./build-all.sh
          timeout: 2h

        - name: 验证关键产物
          script: |
            test -f /tmp/imagefs-output/imagefs.txz
            test -x /tmp/imagefs-build/imagefs/usr/bin/box64
            ls -lh /tmp/imagefs-output/

        - name: 构建 native-libs (winlator 原生库)
          allowFailure: true
          timeout: 1h
          script: |
            export WINLATOR_SRC=/tmp/winlator-bionic/app/src/main/cpp
            ./build-native-libs.sh adrenotools winlator-native proot virglrenderer

        - name: 收集产物
          script: |
            mkdir -p artifacts
            cp /tmp/imagefs-output/imagefs.txz artifacts/
            cp /tmp/imagefs-output/imagefs.txz.sha256sum artifacts/
            if ls output/native-libs/*.so >/dev/null 2>&1; then
              tar cJf artifacts/native-libs.tar.xz -C output native-libs
            fi
            echo "=== 产物清单 ==="
            ls -lh artifacts/

        - name: 创建 Release
          type: git:release
          options:
            title: ${CNB_BRANCH}
            description: winlator bionic imagefs 构建产物

        - name: 上传产物到 Release 附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - ./artifacts/imagefs.txz
              - ./artifacts/imagefs.txz.sha256sum
              - ./artifacts/native-libs.tar.xz
