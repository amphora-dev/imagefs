# Meson cross file: aarch64-linux-android (Bionic) via Android NDK r29
# 复现 winlator_bionic imagefs 的交叉编译工具链
[binaries]
c       = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
cpp     = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
ar      = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
as      = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as'
ld      = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
strip   = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
ranlib  = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
nm      = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
pkgconfig = 'pkg-config'

[built-in options]
c_args       = ['-fPIC', '-O2', '-fvisibility=hidden', '-I/tmp/bionic_build/imagefs/usr/include']
cpp_args     = ['-fPIC', '-O2', '-fvisibility=hidden', '-I/tmp/bionic_build/imagefs/usr/include']
c_link_args  = ['-Wl,-rpath,/usr/lib', '-L/tmp/bionic_build/imagefs/usr/lib',
                '-Wl,--allow-shlib-undefined']
cpp_link_args= ['-Wl,-rpath,/usr/lib', '-L/tmp/bionic_build/imagefs/usr/lib',
                '-Wl,--allow-shlib-undefined']

[properties]
sys_root     = '/tmp/ndk_extract/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
# Bionic 目标: 复用宿主 /system/lib64 的 libc/libdl/libm (不捆绑 glibc)
needs_exe_wrapper = false

[host_machine]
system    = 'android'
cpu_family = 'aarch64'
cpu       = 'aarch64'
endian    = 'little'
