[binaries]
c = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
cpp = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
ar = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
as = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as'
ld = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
strip = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
ranlib = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
nm = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-fPIC', '-O2', '-I/opt/android-sysroot/usr/include']
cpp_args = ['-fPIC', '-O2', '-I/opt/android-sysroot/usr/include']
c_link_args = ['-L/opt/android-sysroot/usr/lib', '-Wl,-rpath,/usr/lib', '-Wl,--allow-shlib-undefined']
cpp_link_args = ['-L/opt/android-sysroot/usr/lib', '-Wl,-rpath,/usr/lib', '-Wl,--allow-shlib-undefined']

[properties]
needs_exe_wrapper = true
sys_root = '/opt/android-sysroot'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
