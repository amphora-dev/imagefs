name: imagefs
min-version: 2.7
element-path: buildstream/elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - autotools
  - cmake
  - meson

- origin: pip
  package-name: buildstream-plugins-community
  sources:
  - zip

aliases:
  ubuntu: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/
  google-android: https://dl.google.com/android/repository/
  zlib: https://github.com/madler/zlib/releases/download/
  zstd: https://github.com/facebook/zstd/releases/download/
  termux: https://github.com/termux/
  khronos: https://github.com/KhronosGroup/
  libffi: https://github.com/libffi/libffi/releases/download/
  imagefs-release: https://github.com/amphora-dev/imagefs/releases/download/
  xorg: https://xorg.freedesktop.org/archive/individual/
  gnu: https://ftp.gnu.org/pub/gnu/
  brotli: https://github.com/google/brotli/archive/refs/tags/
  expat: https://github.com/libexpat/libexpat/releases/download/
  pcre2: https://github.com/PCRE2Project/pcre2/releases/download/
  alsa: https://www.alsa-project.org/files/pub/lib/
  libpng: https://download.sourceforge.net/libpng/
  freetype: https://downloads.sourceforge.net/freetype/
  fontconfig: https://www.freedesktop.org/software/fontconfig/release/
  gnome: https://download.gnome.org/sources/
  proxy-libintl: https://github.com/frida/proxy-libintl/archive/refs/tags/
  openssl: https://github.com/openssl/openssl/releases/download/
  gnutls: https://www.gnupg.org/ftp/gcrypt/gnutls/
  dri: https://dri.freedesktop.org/
  sdl: https://github.com/libsdl-org/SDL/releases/download/
  gstreamer: https://gstreamer.freedesktop.org/src/

variables:
  prefix: /usr
  ndk-root: /opt/android-ndk
  ndk-toolchain: "%{ndk-root}/toolchains/llvm/prebuilt/linux-x86_64"
  target-triple: aarch64-linux-android26

environment:
  PATH: "%{ndk-toolchain}/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  CC: "%{ndk-toolchain}/bin/%{target-triple}-clang"
  CXX: "%{ndk-toolchain}/bin/%{target-triple}-clang++"
  AR: "%{ndk-toolchain}/bin/llvm-ar"
  RANLIB: "%{ndk-toolchain}/bin/llvm-ranlib"
  NM: "%{ndk-toolchain}/bin/llvm-nm"
  STRIP: "%{ndk-toolchain}/bin/llvm-strip"
  LC_ALL: C.UTF-8

elements:
  autotools:
    variables:
      conf-global: --host=aarch64-linux-android
    environment:
      CFLAGS: "-fPIC -O2 -I/opt/android-sysroot%{prefix}/include"
      CPPFLAGS: "-I/opt/android-sysroot%{prefix}/include"
      LDFLAGS: "-L/opt/android-sysroot%{prefix}/lib -Wl,-rpath,/usr/lib -Wl,--allow-shlib-undefined"
      PKG_CONFIG_PATH: ""
      PKG_CONFIG_SYSROOT_DIR: /opt/android-sysroot
      PKG_CONFIG_LIBDIR: "/opt/android-sysroot%{prefix}/lib/pkgconfig:/opt/android-sysroot%{prefix}/share/pkgconfig"
  cmake:
    variables:
      cmake-global: >-
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -DCMAKE_C_COMPILER=%{ndk-toolchain}/bin/%{target-triple}-clang
        -DCMAKE_CXX_COMPILER=%{ndk-toolchain}/bin/%{target-triple}-clang++
        -DCMAKE_AR=%{ndk-toolchain}/bin/llvm-ar
        -DCMAKE_RANLIB=%{ndk-toolchain}/bin/llvm-ranlib
        -DCMAKE_STRIP=%{ndk-toolchain}/bin/llvm-strip
        -DCMAKE_C_FLAGS=-fPIC\ -O2\ -I/opt/android-sysroot%{prefix}/include
        -DCMAKE_CXX_FLAGS=-fPIC\ -O2\ -I/opt/android-sysroot%{prefix}/include
        -DCMAKE_SHARED_LINKER_FLAGS=-L/opt/android-sysroot%{prefix}/lib\ -Wl,-rpath,/usr/lib\ -Wl,--allow-shlib-undefined
        -DCMAKE_PREFIX_PATH=/opt/android-sysroot%{prefix}
        -DCMAKE_FIND_ROOT_PATH=/opt/android-sysroot
        -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
    environment:
      PKG_CONFIG_PATH: ""
      PKG_CONFIG_SYSROOT_DIR: /opt/android-sysroot
      PKG_CONFIG_LIBDIR: "/opt/android-sysroot%{prefix}/lib/pkgconfig:/opt/android-sysroot%{prefix}/share/pkgconfig"
  meson:
    variables:
      meson-global: >-
        --cross-file=%{build-root}/.bst/meson-aarch64-android26.ini
        --buildtype=release
    environment:
      PKG_CONFIG_PATH: ""
      PKG_CONFIG_SYSROOT_DIR: /opt/android-sysroot
      PKG_CONFIG_LIBDIR: "/opt/android-sysroot%{prefix}/lib/pkgconfig:/opt/android-sysroot%{prefix}/share/pkgconfig"

# Package elements install into isolated /usr artifacts. Ubuntu and the NDK are
# build dependencies only; no shared mutable staging tree is restored.
