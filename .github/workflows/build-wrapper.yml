# Build wrapper-*.tzst → Release tag `wrapper` → runtimeAssets[wrapper.tzst]
# Contracts: ci/README.md
# No schedule — run manually or when wrapper graph inputs change.
name: build-wrapper

# Auto: leaf inputs + X11/drm/sysvshm staging recipes that affect the ICD ABI.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this commit was already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ci/wrapper/**"
      - "ci/gate/wrapper-build.sh"
      - "vendor/wrapper-patches/**"
      - "buildstream/elements/**"
      - "project.conf"
      - "ci/setup/install-buildstream.sh"
      - ".github/workflows/build-wrapper.yml"

permissions:
  contents: write

env:
  OUTPUT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install BuildStream sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-profiles apparmor-utils bubblewrap fuse3 lzip patch \
            python3-venv xz-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: buildstream-wrapper-v2-${{ runner.os }}-${{ hashFiles('project.conf', 'buildstream/elements/l1/wrapper-tzst.bst', 'buildstream/elements/buildstream-sdk.bst', 'ci/wrapper/**', 'vendor/wrapper-patches/**') }}
          restore-keys: |
            buildstream-wrapper-v1-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/imagefs-buildstream/tools
          key: buildstream-tools-v3-${{ runner.os }}-bst-2.7.0-core-plugins-2.7.0-community-2.3.1-buildbox-1.4.15

      - run: bash ci/setup/install-buildstream.sh

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: bash ci/gate/wrapper-build.sh

      - name: Build wrapper.tzst
        if: steps.gate.outputs.should_build == 'true'
        run: |
          mkdir -p "$OUTPUT_DIR"
          rm -rf /tmp/buildstream-wrapper
          buildstream/bst build l1/wrapper-tzst.bst
          buildstream/bst artifact checkout l1/wrapper-tzst.bst \
            --deps none \
            --directory /tmp/buildstream-wrapper
          cp /tmp/buildstream-wrapper/artifacts/* artifacts/
          # shellcheck disable=SC1091
          source artifacts/wrapper-tzst.env
          {
            echo "TZST_NAME=$TZST_NAME"
            echo "FULL_VERSION=$FULL_VERSION"
            echo "SHA256=$SHA256"
            echo "SIZE=$SIZE"
            echo "COMMIT_FULL=$COMMIT_FULL"
            echo "COMMIT_SHORT=$COMMIT_SHORT"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.should_build == 'true'
        with:
          name: wrapper-tzst
          path: artifacts/wrapper-*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release wrapper
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.sha }}
        run: |
          BODY=$(cat <<EOF
          Pipetto Mesa vulkan wrapper \`${{ env.FULL_VERSION }}\`
          https://github.com/Pipetto-crypto/mesa/commit/${{ env.COMMIT_FULL }}
          Built against imagefs staging (X11/drm/sysvshm). Not packed into imagefs.txz.
          EOF
          )
          bash ci/publish/fixed-release.sh \
            --tag wrapper \
            --title wrapper \
            --body "$BODY" \
            -- "artifacts/${{ env.TZST_NAME }}" "artifacts/${{ env.TZST_NAME }}.sha256sum"

      - name: Prune old wrapper assets
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bash ci/publish/prune-assets.sh \
            --tag wrapper \
            --match 'wrapper-*' \
            --keep "${{ env.TZST_NAME }}" "${{ env.TZST_NAME }}.sha256sum"

      # The wrapper is a runtimeAssets[] pin: Amphora provisions it into
      # filesDir/runtime-assets/ and the kernel reads it from there. It used to
      # be mirrored into components.turnip as well, which nothing resolved.
      - name: Pin content_manifest wrapper.tzst
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/bump-manifest
        with:
          runtime_asset: graphics_driver/wrapper.tzst
          sha256: ${{ env.SHA256 }}
          size: ${{ env.SIZE }}
          ver_name: ${{ env.FULL_VERSION }}
          remote_url: https://github.com/${{ github.repository }}/releases/download/wrapper/${{ env.TZST_NAME }}
          token: ${{ secrets.AMPHORA_REPO_TOKEN }}
