# Cheap checks on every push/PR. The three build workflows are gated by narrow
# path filters (a full imagefs graph build is expensive), which left every shared
# script under ci/ with no automatic verification at all. This runs in seconds and
# covers all of them.
name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version
          # Severity floor is `warning`: `note` is dominated by SC2086 on our own
          # $PREFIX globs, where word splitting is intended. See .shellcheckrc for
          # the two rule-level disables and why.
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          shellcheck -S warning -f gcc "${scripts[@]}"

      - name: bash -n
        run: |
          # shellcheck's parser is not bash's; syntax-check with the real thing too.
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -n1 bash -n

      - name: executable bit on entrypoints
        run: |
          test -x buildstream/bst
          test -x buildstream/sync-arch-elements.py

      - name: BuildStream inline commands are POSIX sh
        run: |
          # BuildStream runs *-commands via `sh -c -e`; the Ubuntu SDK's /bin/sh
          # is dash, so bash-only syntax fails only in CI builds
          # (build-box64 run 36211466431). Bash logic belongs in ci/**/*.sh.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 ci/lint/check-bst-inline-sh.py

      - name: arch recipe sync
        run: |
          # Simple dual-arch recipes under buildstream/recipes/; generated
          # elements must match. Shared proto/header packages must not be
          # duplicated under wine/. Complex packages are hand-maintained.
          python3 buildstream/sync-arch-elements.py --check