name: build-proton-wine

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this Proton commit was already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
    - "buildstream/elements/l1/proton-wine-wcp.bst"
    - "buildstream/elements/tools/**"
    - "buildstream/elements/wine/**"
    - "buildstream/elements/buildstream-sdk.bst"
    # Arch-independent packages shared into the Wine sysroot (see wine-x86_64-shared.txt).
    - "buildstream/elements/x11/xcb-proto.bst"
    - "buildstream/elements/x11/xorgproto.bst"
    - "buildstream/elements/x11/xtrans.bst"
    - "buildstream/elements/graphics/vulkan-headers.bst"
    - "buildstream/wine-x86_64-shared.txt"
    - "vendor/wrapper-patches/**"
    - "vendor/mesa-gl-patches/**"
    - "vendor/winlator-bionic/**"
    - "vendor/proton-prefix/**"
    - "ci/wine/**"
    - "ci/gate/wine-build.sh"
    - "ci/verify/proton-wcp.sh"
    - "ci/setup/install-buildstream.sh"
    - "ci/setup/configure-remote-cache.sh"
    - ".github/actions/setup-buildstream/**"
    - "project.conf"
    - ".github/workflows/build-proton-wine.yml"

permissions:
  actions: write
  contents: write

# GitHub cache snapshots are immutable and cannot be merged. Serialize runs on
# the same ref so every main build restores and extends the latest snapshot.
# Other BuildStream workflows remain independent.
concurrency:
  group: build-proton-wine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    # This gate only reads the pinned commit and GitHub release metadata, so a
    # no-op, non-forced dispatch can exit before installing BuildStream.
    - id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
      run: bash ci/gate/wine-build.sh

    - name: Free disk space
      if: steps.gate.outputs.should_build == 'true'
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY"
        df -h

    - uses: ./.github/actions/setup-buildstream
      if: steps.gate.outputs.should_build == 'true'
      with:
        remote-cache-token: ${{ secrets.BST_REMOTE_CACHE_TOKEN }}

    # Query only the artifact index. Do not download the 1.5 GiB local action
    # snapshot when the exact element artifact can be pulled directly.
    - name: Check exact Wine element artifact
      id: wine-element
      if: steps.gate.outputs.should_build == 'true'
      run: |
        state="$(buildstream/bst artifact show --deps none l1/proton-wine-wcp.bst)"
        echo "$state"
        if grep -Eq '^[[:space:]]*(cached|available)[[:space:]]+l1/proton-wine-wcp\.bst([[:space:]]|$)' <<<"$state"; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Exact Wine artifact is cached; skip local action snapshot"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "Wine artifact is absent; restore local action snapshot"
        fi

    - name: Restore local Wine action cache
      id: wine-recc-cache-restore
      if: steps.gate.outputs.should_build == 'true' && steps.wine-element.outputs.available != 'true'
      uses: actions/cache/restore@v4
      with:
        # Action-result metadata references output blobs in CAS; cache both as
        # one archive. Sources, logs and artifact refs stay remote-only.
        path: |
          ~/.cache/buildstream/cas
          ~/.cache/buildstream/actioncache
        # Cache entries are immutable. Use a unique save key and restore the
        # newest prior snapshot via the stable prefix.
        key: wine-recc-local-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          wine-recc-local-v3-${{ runner.os }}-

    - name: Prefer restored local action cache
      if: steps.gate.outputs.should_build == 'true' && steps.wine-element.outputs.available != 'true' && steps.wine-recc-cache-restore.outputs.cache-matched-key != ''
      env:
        BST_ACTION_CACHE_MODE: local
        BST_REMOTE_CACHE_REQUIRED: true
        BST_REMOTE_CACHE_TOKEN: ${{ secrets.BST_REMOTE_CACHE_TOKEN }}
      run: bash ci/setup/configure-remote-cache.sh

    - name: Build Proton Wine WCP
      id: wine-build
      if: steps.gate.outputs.should_build == 'true'
      run: |
        rm -rf /tmp/buildstream-proton-wine artifacts
        buildstream/bst build l1/proton-wine-wcp.bst
        # The sandbox stdout is in the element log, not this step's console.
        logdir="${XDG_CACHE_HOME:-$HOME/.cache}/buildstream/logs"
        summary=$(
          find "$logdir" -type f -path '*proton-wine-wcp*build*.log' -print0 \
            | xargs -0 -r grep -h 'recc actions:' \
            | tail -n 1 || true
        )
        if [ -n "$summary" ]; then
          echo "::notice::$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "recc-built=true" >> "$GITHUB_OUTPUT"
        else
          echo "recc actions: element was cached, no build log"
          echo "recc-built=false" >> "$GITHUB_OUTPUT"
        fi
        # Benchmark only: expose unsupported-command classification.
        find "$logdir" -type f -path '*proton-wine-wcp*build*.log' -print0 \
          | xargs -0 -r grep -h '^recc unsupported' || true
        buildstream/bst artifact checkout l1/proton-wine-wcp.bst \
          --deps none \
          --directory /tmp/buildstream-proton-wine
        mkdir -p artifacts
        cp /tmp/buildstream-proton-wine/artifacts/* artifacts/
        # shellcheck disable=SC1091
        source artifacts/proton-wine-wcp.env
        {
          echo "WCP_NAME=$WCP_NAME"
          echo "FULL_VERSION=$FULL_VERSION"
          echo "SHA256=$SHA256"
          echo "SIZE=$SIZE"
          echo "COMMIT_FULL=$COMMIT_FULL"
          echo "COMMIT_SHORT=$COMMIT_SHORT"
          echo "VER_CODE=$VER_CODE"
        } >> "$GITHUB_ENV"

    - name: Verify Proton Wine WCP
      if: steps.gate.outputs.should_build == 'true'
      run: |
        rm -rf /tmp/wine-sysroot
        buildstream/bst artifact checkout wine/sysroot-x86_64.bst \
          --deps none \
          --directory /tmp/wine-sysroot
        SYSROOT=/tmp/wine-sysroot bash ci/verify/wine-sysroot.sh
        bash ci/verify/proton-wcp.sh

    # Only trusted main builds advance the canonical snapshot lineage. Manual
    # branch runs may restore main's cache but cannot create competing snapshots.
    - name: Save local Wine action cache
      id: wine-recc-cache-save
      if: success() && github.ref == 'refs/heads/main' && steps.wine-build.outputs.recc-built == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/buildstream/cas
          ~/.cache/buildstream/actioncache
        key: wine-recc-local-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Keep two local Wine action cache snapshots
      if: success() && github.ref == 'refs/heads/main' && steps.wine-recc-cache-save.outcome == 'success'
      env:
        CACHE_PREFIX: wine-recc-local-v3-${{ runner.os }}-
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list \
          --ref refs/heads/main \
          --key "$CACHE_PREFIX" \
          --limit 100 \
          --json id,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[2:][]?.id' \
          | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh api --method DELETE "repos/$GH_REPO/actions/caches/$cache_id"
            done

    - uses: actions/upload-artifact@v4
      if: steps.gate.outputs.should_build == 'true'
      with:
        name: proton-wine-wcp
        path: artifacts/Proton-*
        if-no-files-found: error
        retention-days: 14

    - name: Publish Release wine
      if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TARGET_REF: ${{ github.sha }}
      run: |
        BODY=$(cat <<EOF
        Amphora Proton Wine \`${{ env.FULL_VERSION }}\`
        https://github.com/amphora-dev/proton-wine/commit/${{ env.COMMIT_FULL }}
        x86_64 Android API30/flexible-16KB Unix side with LLVM-MinGW WoW64 PE.
        EOF
        )
        bash ci/publish/fixed-release.sh \
          --tag wine \
          --title wine \
          --body "$BODY" \
          -- "artifacts/${{ env.WCP_NAME }}" "artifacts/${{ env.WCP_NAME }}.sha256sum"

    - name: Remove superseded Proton assets
      if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        bash ci/publish/prune-assets.sh \
          --tag wine \
          --match 'Proton-*' \
          --keep "${{ env.WCP_NAME }}" "${{ env.WCP_NAME }}.sha256sum"

    - name: Pin content_manifest wine
      if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
      uses: ./.github/actions/bump-manifest
      with:
        component: wine
        sha256: ${{ env.SHA256 }}
        size: ${{ env.SIZE }}
        asset_path: ${{ env.WCP_NAME }}
        ver_name: ${{ env.FULL_VERSION }}
        ver_code: ${{ env.VER_CODE }}
        remote_url: https://github.com/${{ github.repository }}/releases/download/wine/${{ env.WCP_NAME }}
        kind: WCP
        content_type: Proton
        token: ${{ secrets.AMPHORA_REPO_TOKEN }}
