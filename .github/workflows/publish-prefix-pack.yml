name: publish-prefix-pack

on:
  workflow_dispatch:
    inputs:
      amphora_run_id:
        description: Amphora Generate PrefixPack workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PREFIX_ID: 11.0-d12a5634a-x86_64-1
    steps:
    - uses: actions/checkout@v4

    - name: Download generated PrefixPack
      uses: actions/download-artifact@v4
      with:
        pattern: prefixPack-${{ env.PREFIX_ID }}-*
        path: generated
        merge-multiple: true
        github-token: ${{ secrets.AMPHORA_REPO_TOKEN }}
        repository: amphora-dev/amphora
        run-id: ${{ inputs.amphora_run_id }}

    - name: Verify artifact against committed provenance
      run: |
        set -euo pipefail
        name="prefixPack-$PREFIX_ID"
        pack="generated/$name.txz"
        generated_metadata="generated/$name.txz.json"
        expected_metadata="vendor/proton-prefix/$name.json"
        test -f "$pack"
        test -f "$generated_metadata"
        test -f "$expected_metadata"
        python3 - "$pack" "$generated_metadata" "$expected_metadata" <<'PY'
        import hashlib
        import json
        import pathlib
        import sys

        pack = pathlib.Path(sys.argv[1])
        generated = json.loads(pathlib.Path(sys.argv[2]).read_text())
        expected = json.loads(pathlib.Path(sys.argv[3]).read_text())
        digest = hashlib.sha256(pack.read_bytes()).hexdigest()
        assert generated["wineVersion"] == expected["wineVersion"]
        assert generated["winePackageSha256"] == expected["winePackageSha256"]
        assert digest == expected["prefixPackSha256"]
        assert pack.stat().st_size == expected["prefixPackSize"]
        PY
        sha256sum "$pack" > "generated/$name.txz.sha256sum"

    - name: Publish fixed PrefixPack release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TARGET_REF: ${{ github.sha }}
      run: |
        name="prefixPack-$PREFIX_ID"
        bash ci/publish/fixed-release.sh \
          --tag proton-prefix \
          --title "Amphora Proton PrefixPack" \
          --body "Deterministic PrefixPack for Proton-$PREFIX_ID." \
          -- "generated/$name.txz" "generated/$name.txz.sha256sum" \
             "vendor/proton-prefix/$name.json"

    - name: Prune superseded PrefixPack assets
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        name="prefixPack-$PREFIX_ID"
        bash ci/publish/prune-assets.sh \
          --tag proton-prefix \
          --match 'prefixPack-*' \
          --keep "$name.txz" "$name.txz.sha256sum" "$name.json"
