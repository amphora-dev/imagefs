name: buildstream-poc

on:
  workflow_dispatch:
  push:
    paths:
    - "project.conf"
    - "buildstream/**"
    - "ci/setup/install-buildstream.sh"
    - ".github/workflows/buildstream-poc.yml"
  pull_request:
    branches: [main]
    paths:
    - "project.conf"
    - "buildstream/**"
    - "ci/setup/install-buildstream.sh"
    - ".github/workflows/buildstream-poc.yml"

jobs:
  package-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install sandbox dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          apparmor-profiles apparmor-utils bubblewrap fuse3 lzip patch \
          python3-venv xz-utils
        # Ubuntu 24.04 restricts unprivileged user namespaces. Load its narrow
        # upstream bwrap profile instead of disabling AppArmor globally.
        sudo install -m 0644 \
          /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
          /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

    - name: Restore BuildStream CAS
      uses: actions/cache@v4
      with:
        path: ~/.cache/buildstream
        # Documentation/wrapper edits do not change package artifacts.
        key: buildstream-zlib-v1-${{ runner.os }}-${{ hashFiles('project.conf', 'buildstream/elements/**') }}
        restore-keys: |
          buildstream-zlib-v1-${{ runner.os }}-

    - name: Restore pinned BuildStream tools
      uses: actions/cache@v4
      with:
        path: ~/.cache/imagefs-buildstream/tools
        key: buildstream-tools-v3-${{ runner.os }}-bst-2.7.0-core-plugins-2.7.0-community-2.3.1-buildbox-1.4.15

    - name: Install pinned BuildStream tools
      run: bash ci/setup/install-buildstream.sh

    - name: Build isolated package artifacts
      run: |
        elements=(
          compress/zlib.bst
          compress/zstd.bst
          compress/brotli.bst
          compress/libpng.bst
          android/libcxx-shared.bst
          android/android-sysvshm.bst
          android/android-spawn.bst
          android/android-sysv-semaphore.bst
          android/libandroid-shmem.bst
          graphics/vulkan-headers.bst
          graphics/libdrm.bst
          graphics/vulkan-loader.bst
          graphics/mesa-gl.bst
          crypto/nettle.bst
          audio/alsa-lib.bst
          audio/alsa-android-aserver.bst
          media/sdl2.bst
          media/gstreamer.bst
          media/gst-plugins-base.bst
          text/libffi.bst
          text/libiconv.bst
          text/libexpat.bst
          text/pcre2.bst
          text/freetype.bst
          text/fontconfig.bst
          text/glib.bst
          crypto/gmp.bst
          crypto/openssl.bst
          crypto/gnutls.bst
          x11/xorgproto.bst
          x11/xtrans.bst
          x11/libxshmfence.bst
          x11/xcb-proto.bst
          x11/libxau.bst
          x11/libxdmcp.bst
          x11/libxcb.bst
          x11/libx11.bst
          x11/libxext.bst
          x11/libxfixes.bst
          x11/libxrender.bst
          x11/libxcursor.bst
          x11/libxi.bst
          x11/libxxf86vm.bst
          tests/autotools-sysroot-smoke.bst
          imagefs/package.bst
        )
        buildstream/bst build "${elements[@]}"
        for element in "${elements[@]}"; do
          buildstream/bst show --deps none "$element" \
            --format '%{state} %{full-key}'
          test "$(buildstream/bst show --deps none "$element" \
            --format '%{state}')" = cached
        done

    - name: Checkout and verify artifacts
      run: |
        # grep -q intentionally closes large readelf/strings streams early.
        # Do not turn the producer's expected SIGPIPE into exit 141.
        set +o pipefail
        rm -rf artifacts/buildstream-*
        buildstream/bst artifact checkout compress/zlib.bst \
          --deps none \
          --directory artifacts/buildstream-zlib
        buildstream/bst artifact checkout compress/zstd.bst \
          --deps none \
          --directory artifacts/buildstream-zstd
        buildstream/bst artifact checkout compress/brotli.bst \
          --deps none \
          --directory artifacts/buildstream-brotli
        buildstream/bst artifact checkout compress/libpng.bst \
          --deps none \
          --directory artifacts/buildstream-libpng
        for element in libcxx-shared android-sysvshm android-spawn android-sysv-semaphore libandroid-shmem; do
          buildstream/bst artifact checkout "android/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done
        buildstream/bst artifact checkout graphics/vulkan-headers.bst \
          --deps none \
          --directory artifacts/buildstream-vulkan-headers
        buildstream/bst artifact checkout graphics/libdrm.bst \
          --deps none \
          --directory artifacts/buildstream-libdrm
        buildstream/bst artifact checkout graphics/vulkan-loader.bst \
          --deps none \
          --directory artifacts/buildstream-vulkan-loader
        buildstream/bst artifact checkout graphics/mesa-gl.bst \
          --deps none \
          --directory artifacts/buildstream-mesa-gl
        buildstream/bst artifact checkout text/libffi.bst \
          --deps none \
          --directory artifacts/buildstream-libffi
        buildstream/bst artifact checkout text/libiconv.bst \
          --deps none \
          --directory artifacts/buildstream-libiconv
        for element in libexpat pcre2; do
          buildstream/bst artifact checkout "text/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done
        buildstream/bst artifact checkout text/freetype.bst \
          --deps none \
          --directory artifacts/buildstream-freetype
        buildstream/bst artifact checkout text/fontconfig.bst \
          --deps none \
          --directory artifacts/buildstream-fontconfig
        buildstream/bst artifact checkout text/glib.bst \
          --deps none \
          --directory artifacts/buildstream-glib
        buildstream/bst artifact checkout imagefs/package.bst \
          --deps none \
          --directory artifacts/buildstream-imagefs-package
        buildstream/bst artifact checkout crypto/gmp.bst \
          --deps none \
          --directory artifacts/buildstream-gmp
        for element in openssl gnutls; do
          buildstream/bst artifact checkout "crypto/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done
        buildstream/bst artifact checkout crypto/nettle.bst \
          --deps none \
          --directory artifacts/buildstream-nettle
        buildstream/bst artifact checkout audio/alsa-lib.bst \
          --deps none \
          --directory artifacts/buildstream-alsa-lib
        buildstream/bst artifact checkout audio/alsa-android-aserver.bst \
          --deps none \
          --directory artifacts/buildstream-alsa-android-aserver
        buildstream/bst artifact checkout media/sdl2.bst \
          --deps none \
          --directory artifacts/buildstream-sdl2
        for element in gstreamer gst-plugins-base; do
          buildstream/bst artifact checkout "media/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done
        for element in xorgproto xtrans libxshmfence xcb-proto libxau libxdmcp libxcb libx11 libxext libxfixes libxrender libxcursor libxi libxxf86vm; do
          buildstream/bst artifact checkout "x11/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done

        test -L artifacts/buildstream-zlib/usr/lib/libz.so
        test -L artifacts/buildstream-zlib/usr/lib/libz.so.1
        test -f artifacts/buildstream-zlib/usr/include/zlib.h
        readelf -dW artifacts/buildstream-zlib/usr/lib/libz.so.1.3.1 |
          grep -q 'SONAME.*libz.so.1'
        test -L artifacts/buildstream-zstd/usr/lib/libzstd.so
        test -L artifacts/buildstream-zstd/usr/lib/libzstd.so.1
        test -f artifacts/buildstream-zstd/usr/include/zstd.h
        readelf -dW artifacts/buildstream-zstd/usr/lib/libzstd.so.1.5.6 |
          grep -q 'SONAME.*libzstd.so.1'
        for symbol in ZSTD_compress ZSTD_decompress ZSTD_versionNumber; do
          readelf -Ws artifacts/buildstream-zstd/usr/lib/libzstd.so.1.5.6 |
            grep -q "GLOBAL.* $symbol$"
        done
        test ! -e artifacts/buildstream-zlib/opt/android-ndk
        test ! -e artifacts/buildstream-zstd/opt/android-ndk

        for lib in common dec enc; do
          brotli=$(find artifacts/buildstream-brotli/usr/lib \
            -type f -name "libbrotli${lib}.so*" -print -quit)
          test -n "$brotli"
          readelf -dW "$brotli" | grep -q "SONAME.*libbrotli${lib}.so"
        done
        brotli_dec=$(find artifacts/buildstream-brotli/usr/lib \
          -type f -name 'libbrotlidec.so*' -print -quit)
        readelf -Ws "$brotli_dec" | grep -q 'GLOBAL.* BrotliDecoderDecompress$'

        png=artifacts/buildstream-libpng/usr/lib/libpng16.so.16.44.0
        test -f "$png"
        readelf -dW "$png" | grep -q 'SONAME.*libpng16.so.16'
        readelf -dW "$png" | grep -q 'NEEDED.*libz.so.1'
        readelf -V "$png" | grep -q 'PNG16_0'
        readelf -Ws "$png" | grep -q 'png_create_read_struct'
        test -L artifacts/buildstream-libpng/usr/lib/libpng.so
        test ! -e artifacts/buildstream-libpng/usr/lib/libz.so

        test -f artifacts/buildstream-libcxx-shared/usr/lib/libc++_shared.so
        readelf -dW artifacts/buildstream-libcxx-shared/usr/lib/libc++_shared.so |
          grep -q 'SONAME.*libc++_shared.so'

        sysv=artifacts/buildstream-android-sysvshm/usr/lib/libandroid-sysvshm.so
        test -L artifacts/buildstream-android-sysvshm/usr/lib/libsysvshm.so
        for symbol in shmget shmat shmdt shmctl \
          libandroid_shmget libandroid_shmat libandroid_shmdt libandroid_shmctl; do
          readelf -Ws "$sysv" | grep -q "GLOBAL.* $symbol$"
        done

        spawn=artifacts/buildstream-android-spawn/usr/lib/libandroid-spawn.so
        for symbol in posix_spawn posix_spawnp glob globfree; do
          readelf -Ws "$spawn" | grep -q "GLOBAL.* $symbol$"
        done
        test -f artifacts/buildstream-android-spawn/usr/include/spawn.h

        semaphore=artifacts/buildstream-android-sysv-semaphore/usr/lib/libandroid-sysv-semaphore.so
        for symbol in semget semop semctl semtimedop; do
          readelf -Ws "$semaphore" | grep -q "GLOBAL.* $symbol$"
        done

        shmem=artifacts/buildstream-libandroid-shmem/usr/lib/libandroid-shmem.so
        readelf -dW "$shmem" | grep -q 'SONAME.*libandroid-shmem.so'
        for symbol in libandroid_shmget libandroid_shmat libandroid_shmdt libandroid_shmctl; do
          readelf -Ws "$shmem" | grep -q "GLOBAL.* $symbol$"
        done
        test ! -e artifacts/buildstream-libandroid-shmem/usr/include/sys/shm.h

        test -f artifacts/buildstream-vulkan-headers/usr/include/vulkan/vulkan.h
        test -f artifacts/buildstream-vulkan-headers/usr/include/vk_video/vulkan_video_codecs_common.h
        test -f artifacts/buildstream-vulkan-headers/usr/share/vulkan/registry/vk.xml
        test -f artifacts/buildstream-vulkan-headers/usr/share/cmake/VulkanHeaders/VulkanHeadersConfig.cmake

        drm=artifacts/buildstream-libdrm/usr/lib/libdrm.so
        test -f "$drm"
        readelf -Ws "$drm" | grep -q 'GLOBAL.* drmIoctl$'
        test -f artifacts/buildstream-libdrm/usr/include/xf86drm.h
        test ! -e artifacts/buildstream-libdrm/usr/lib/libdrm_amdgpu.so

        vulkan=artifacts/buildstream-vulkan-loader/usr/lib/libvulkan.so
        test -f "$vulkan"
        readelf -Ws "$vulkan" | grep -q 'GLOBAL.* vkGetInstanceProcAddr$'
        strings "$vulkan" | grep -q 'VK_KHR_xcb_surface'
        strings "$vulkan" | grep -q 'VK_KHR_xlib_surface'
        test ! -e artifacts/buildstream-vulkan-loader/usr/lib/libxcb.so

        mesa_gl=$(find artifacts/buildstream-mesa-gl/usr/lib \
          -type f -name 'libGL.so.1.*' -print -quit)
        mesa_egl=$(find artifacts/buildstream-mesa-gl/usr/lib \
          -type f -name 'libEGL.so.1.*' -print -quit)
        mesa_gallium=$(find artifacts/buildstream-mesa-gl/usr/lib \
          -type f -name 'libgallium*.so' -print -quit)
        test -n "$mesa_gl"
        test -n "$mesa_egl"
        test -n "$mesa_gallium"
        test -f artifacts/buildstream-mesa-gl/usr/lib/.libgl-zink
        strings "$mesa_gallium" | grep -q 'ZINK:'
        strings "$mesa_gallium" | grep -qx 'libvulkan.so.1'
        test ! -e artifacts/buildstream-mesa-gl/usr/lib/libvulkan.so

        ffi=artifacts/buildstream-libffi/usr/lib/libffi.so
        test -f "$ffi"
        readelf -dW "$ffi" | grep -q 'SONAME.*libffi.so'
        readelf -V "$ffi" | grep -q 'LIBFFI_BASE_8.0'
        for symbol in ffi_call ffi_prep_cif ffi_prep_closure_loc; do
          readelf -Ws "$ffi" | grep -q "GLOBAL.* $symbol"
        done
        test ! -e artifacts/buildstream-libffi/bin/bash
        test ! -e artifacts/buildstream-libffi/opt/android-ndk

        test -f artifacts/buildstream-libiconv/usr/lib/libiconv.a
        test -f artifacts/buildstream-libiconv/usr/include/iconv.h
        test ! -e artifacts/buildstream-libiconv/usr/lib/libiconv.so
        test -z "$(find artifacts/buildstream-libiconv -name '*.la' -print -quit)"

        expat=$(find artifacts/buildstream-libexpat/usr/lib \
          -type f -name 'libexpat.so*' -print -quit)
        test -n "$expat"
        readelf -dW "$expat" | grep -q 'SONAME.*libexpat.so'
        readelf -Ws "$expat" | grep -q 'GLOBAL.* XML_ParserCreate$'
        test -f artifacts/buildstream-libexpat/usr/include/expat.h

        pcre2=$(find artifacts/buildstream-pcre2/usr/lib \
          -type f -name 'libpcre2-8.so*' -print -quit)
        test -n "$pcre2"
        readelf -dW "$pcre2" | grep -q 'SONAME.*libpcre2-8.so'
        readelf -Ws "$pcre2" | grep -q 'GLOBAL.* pcre2_compile_8$'
        test -f artifacts/buildstream-pcre2/usr/include/pcre2.h
        test ! -e artifacts/buildstream-pcre2/usr/bin/pcre2grep

        freetype=$(find artifacts/buildstream-freetype/usr/lib \
          -type f -name 'libfreetype.so*' -print -quit)
        test -n "$freetype"
        readelf -dW "$freetype" | grep -q 'SONAME.*libfreetype.so'
        readelf -dW "$freetype" | grep -q 'NEEDED.*libpng16.so.16'
        readelf -dW "$freetype" | grep -q 'NEEDED.*libz.so.1'
        readelf -dW "$freetype" | grep -q 'NEEDED.*libbrotlidec.so.1'
        readelf -Ws "$freetype" | grep -q 'GLOBAL.* FT_Init_FreeType$'
        test ! -e artifacts/buildstream-freetype/usr/lib/libpng16.so

        fontconfig=$(find artifacts/buildstream-fontconfig/usr/lib \
          -type f -name 'libfontconfig.so*' -print -quit)
        test -n "$fontconfig"
        readelf -dW "$fontconfig" | grep -q 'NEEDED.*libfreetype.so'
        readelf -dW "$fontconfig" | grep -q 'NEEDED.*libexpat.so.1'
        readelf -Ws "$fontconfig" | grep -q 'GLOBAL.* FcInit$'
        test -f artifacts/buildstream-fontconfig/usr/etc/fonts/fonts.conf
        test ! -e artifacts/buildstream-fontconfig/usr/lib/libfreetype.so

        glib=artifacts/buildstream-glib/usr/lib/libglib-2.0.so
        gobject=artifacts/buildstream-glib/usr/lib/libgobject-2.0.so
        gio=artifacts/buildstream-glib/usr/lib/libgio-2.0.so
        girepository=artifacts/buildstream-glib/usr/lib/libgirepository-2.0.so
        intl=artifacts/buildstream-glib/usr/lib/libintl.so
        for dso in "$glib" "$gobject" "$gio" "$girepository" "$intl"; do
          test -f "$dso"
        done
        readelf -dW "$glib" | grep -q 'NEEDED.*libintl.so'
        readelf -dW "$glib" | grep -q 'NEEDED.*libpcre2-8.so.0'
        readelf -Ws "$glib" | grep -q 'GLOBAL.* g_malloc$'
        readelf -Ws "$gobject" | grep -q 'GLOBAL.* g_object_new$'
        readelf -Ws "$gio" | grep -q 'GLOBAL.* g_file_new_for_path$'
        test -f artifacts/buildstream-glib/usr/bin/glib-mkenums
        test ! -e artifacts/buildstream-glib/usr/lib/libpcre2-8.so

        gmp=artifacts/buildstream-gmp/usr/lib/libgmp.so
        test -f "$gmp"
        readelf -dW "$gmp" | grep -q 'SONAME.*libgmp.so'
        for symbol in __gmpz_init __gmpz_mul __gmpz_clear; do
          readelf -Ws "$gmp" | grep -q "GLOBAL.* $symbol"
        done
        test -z "$(find artifacts/buildstream-gmp -name '*.la' -print -quit)"
        test ! -e artifacts/buildstream-gmp/usr/bin/gcc

        ssl=$(find artifacts/buildstream-openssl/usr/lib \
          -type f -name 'libssl.so*' -print -quit)
        crypto=$(find artifacts/buildstream-openssl/usr/lib \
          -type f -name 'libcrypto.so*' -print -quit)
        test -n "$ssl"
        test -n "$crypto"
        readelf -dW "$ssl" | grep -q 'NEEDED.*libcrypto.so'
        readelf -Ws "$ssl" | grep -q 'GLOBAL.* SSL_new'
        readelf -Ws "$crypto" | grep -q 'GLOBAL.* EVP_EncryptInit'
        test -d artifacts/buildstream-openssl/usr/etc/ssl

        gnutls=$(find artifacts/buildstream-gnutls/usr/lib \
          -type f -name 'libgnutls.so*' -print -quit)
        test -n "$gnutls"
        readelf -dW "$gnutls" | grep -q 'NEEDED.*libhogweed.so'
        readelf -dW "$gnutls" | grep -q 'NEEDED.*libnettle.so'
        readelf -Ws "$gnutls" | grep -q 'GLOBAL.* gnutls_init'
        test -f artifacts/buildstream-gnutls/usr/lib/pkgconfig/gnutls.pc
        gnutlsxx=artifacts/buildstream-gnutls/usr/lib/libgnutlsxx.so
        test -f "$gnutlsxx"
        readelf -dW "$gnutlsxx" | grep -q 'NEEDED.*libc++_shared.so'
        test ! -e artifacts/buildstream-gnutls/usr/lib/libhogweed.so
        test ! -e artifacts/buildstream-gnutls/usr/lib/libc++_shared.so

        nettle=$(find artifacts/buildstream-nettle/usr/lib \
          -type f -name 'libnettle.so*' -print -quit)
        hogweed=$(find artifacts/buildstream-nettle/usr/lib \
          -type f -name 'libhogweed.so*' -print -quit)
        test -n "$nettle"
        test -n "$hogweed"
        readelf -Ws "$nettle" | grep -q 'GLOBAL.* nettle_sha256_init$'
        readelf -Ws "$hogweed" | grep -q 'GLOBAL.* nettle_rsa_sec_decrypt$'
        readelf -dW "$hogweed" | grep -q 'NEEDED.*libgmp.so'
        test ! -e artifacts/buildstream-nettle/usr/include/gmp.h

        asound=artifacts/buildstream-alsa-lib/usr/lib/libasound.so
        test -f "$asound"
        test -e artifacts/buildstream-alsa-lib/usr/lib/libasound.so.2
        readelf -Ws "$asound" | grep -q 'GLOBAL.* snd_pcm_open'
        test -f artifacts/buildstream-alsa-lib/usr/include/alsa/pcm_external.h
        test -z "$(find artifacts/buildstream-alsa-lib -name '*.la' -print -quit)"

        aserver=artifacts/buildstream-alsa-android-aserver/usr/lib/asound_module_pcm_android_aserver.so
        test -f "$aserver"
        readelf -dW "$aserver" | grep -q 'NEEDED.*libasound.so'
        readelf -Ws "$aserver" |
          grep -q 'GLOBAL.* _snd_pcm_android_aserver_open$'
        test -L artifacts/buildstream-alsa-android-aserver/usr/lib/alsa-lib/libasound_module_pcm_android_aserver.so
        test -f artifacts/buildstream-alsa-android-aserver/usr/etc/alsa/conf.d/android_aserver.conf
        test ! -e artifacts/buildstream-alsa-android-aserver/usr/lib/libasound.so

        sdl=$(find artifacts/buildstream-sdl2/usr/lib \
          -type f -name 'libSDL2-2.0.so*' -print -quit)
        test -n "$sdl"
        readelf -Ws "$sdl" | grep -q 'GLOBAL.* SDL_Init$'
        strings "$sdl" | grep -qx 'libasound.so'
        strings "$sdl" | grep -q 'libX11.so'
        test ! -e artifacts/buildstream-sdl2/usr/lib/libasound.so

        gst=artifacts/buildstream-gstreamer/usr/lib/libgstreamer-1.0.so
        gstbase=artifacts/buildstream-gstreamer/usr/lib/libgstbase-1.0.so
        test -f "$gst"
        test -f "$gstbase"
        readelf -Ws "$gst" | grep -q 'GLOBAL.* gst_init$'
        readelf -dW "$gst" | grep -q 'NEEDED.*libglib-2.0.so'
        test ! -e artifacts/buildstream-gstreamer/usr/lib/libglib-2.0.so

        for lib in app audio video tag gl; do
          dso="artifacts/buildstream-gst-plugins-base/usr/lib/libgst${lib}-1.0.so"
          test -f "$dso"
          readelf -dW "$dso" | grep -q 'NEEDED.*libgstreamer-1.0.so'
        done
        test ! -e artifacts/buildstream-gst-plugins-base/usr/lib/libgstreamer-1.0.so

        test -f artifacts/buildstream-xorgproto/usr/include/X11/Xproto.h
        test -f artifacts/buildstream-xorgproto/usr/share/pkgconfig/xproto.pc
        test -f artifacts/buildstream-xtrans/usr/include/X11/Xtrans/Xtrans.h
        test -f artifacts/buildstream-xtrans/usr/share/pkgconfig/xtrans.pc

        fence=artifacts/buildstream-libxshmfence/usr/lib/libxshmfence.so
        test -f "$fence"
        readelf -dW "$fence" | grep -q 'SONAME.*libxshmfence.so'
        test -f artifacts/buildstream-libxshmfence/usr/include/X11/xshmfence.h
        test -f artifacts/buildstream-libxshmfence/usr/lib/pkgconfig/xshmfence.pc
        test ! -e artifacts/buildstream-libxshmfence/usr/include/X11/Xproto.h

        test -f artifacts/buildstream-xcb-proto/usr/share/xcb/xproto.xml
        test -n "$(find artifacts/buildstream-xcb-proto \
          -path '*/xcbgen/state.py' -print -quit)"

        xau=artifacts/buildstream-libxau/usr/lib/libXau.so
        xdmcp=artifacts/buildstream-libxdmcp/usr/lib/libXdmcp.so
        readelf -Ws "$xau" | grep -q 'GLOBAL.* XauGetAuthByAddr$'
        readelf -Ws "$xdmcp" | grep -q 'GLOBAL.* XdmcpReadARRAY8$'

        xcb=artifacts/buildstream-libxcb/usr/lib/libxcb.so
        test -f "$xcb"
        readelf -dW "$xcb" | grep -q 'NEEDED.*libXau.so'
        readelf -dW "$xcb" | grep -q 'NEEDED.*libXdmcp.so'
        test -f artifacts/buildstream-libxcb/usr/include/xcb/present.h
        grep -q 'xcb_present_pixmap_synced' \
          artifacts/buildstream-libxcb/usr/include/xcb/present.h
        test ! -e artifacts/buildstream-libxcb/usr/lib/libXau.so

        x11=artifacts/buildstream-libx11/usr/lib/libX11.so
        test -f "$x11"
        readelf -dW "$x11" | grep -q 'NEEDED.*libxcb.so'
        readelf -dW "$x11" | grep -q 'NEEDED.*libandroid-sysvshm.so'
        readelf -Ws "$x11" | grep -q 'GLOBAL.* XOpenDisplay$'
        strings "$x11" | grep -qx 'libXcursor.so'
        test -f artifacts/buildstream-libx11/usr/include/X11/Xlib.h
        test ! -e artifacts/buildstream-libx11/usr/lib/libxcb.so

        for spec in \
          libxext:libXext.so:XextCreateExtension \
          libxfixes:libXfixes.so:XFixesQueryExtension \
          libxrender:libXrender.so:XRenderQueryExtension; do
          artifact=${spec%%:*}
          rest=${spec#*:}
          soname=${rest%%:*}
          symbol=${rest#*:}
          dso="artifacts/buildstream-$artifact/usr/lib/$soname"
          test -f "$dso"
          readelf -dW "$dso" | grep -q 'NEEDED.*libX11.so'
          readelf -Ws "$dso" | grep -q "GLOBAL.* $symbol$"
          test ! -e "artifacts/buildstream-$artifact/usr/lib/libX11.so"
        done

        for spec in \
          libxcursor:libXcursor.so:XcursorImageCreate \
          libxi:libXi.so:XIQueryVersion \
          libxxf86vm:libXxf86vm.so:XF86VidModeQueryVersion; do
          artifact=${spec%%:*}
          rest=${spec#*:}
          soname=${rest%%:*}
          symbol=${rest#*:}
          dso="artifacts/buildstream-$artifact/usr/lib/$soname"
          test -f "$dso"
          readelf -dW "$dso" | grep -q 'NEEDED.*libX11.so'
          readelf -Ws "$dso" | grep -q "GLOBAL.* $symbol$"
          test ! -e "artifacts/buildstream-$artifact/usr/lib/libX11.so"
        done

        cp artifacts/buildstream-imagefs-package/artifacts/imagefs.txz* \
          artifacts/
        (
          cd artifacts
          sha256sum -c imagefs.txz.sha256sum
        )
        tar -tJf artifacts/imagefs.txz >/dev/null
        verify_build="$RUNNER_TEMP/buildstream-imagefs-verify"
        rm -rf "$verify_build"
        mkdir -p "$verify_build/staging"
        tar -xJf artifacts/imagefs.txz -C "$verify_build/staging"
        OUTPUT_DIR="$PWD/artifacts" \
          BUILD_DIR="$verify_build" \
          IMAGEFS_RUNTIME_STAGE="$verify_build/staging" \
          ARTIFACTS="$RUNNER_TEMP/buildstream-verified-artifacts" \
          bash ci/verify/imagefs-artifact.sh

    - uses: actions/upload-artifact@v4
      with:
        name: buildstream-package-artifacts
        path: |
          artifacts/buildstream-*
          artifacts/imagefs.txz*
        if-no-files-found: error
        retention-days: 7
