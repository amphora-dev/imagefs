name: buildstream-poc

on:
  workflow_dispatch:
  push:
    paths:
    - "project.conf"
    - "buildstream/**"
    - "ci/setup/install-buildstream.sh"
    - ".github/workflows/buildstream-poc.yml"
  pull_request:
    branches: [main]
    paths:
    - "project.conf"
    - "buildstream/**"
    - "ci/setup/install-buildstream.sh"
    - ".github/workflows/buildstream-poc.yml"

jobs:
  package-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install sandbox dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          apparmor-profiles apparmor-utils bubblewrap fuse3 lzip patch \
          python3-venv xz-utils
        # Ubuntu 24.04 restricts unprivileged user namespaces. Load its narrow
        # upstream bwrap profile instead of disabling AppArmor globally.
        sudo install -m 0644 \
          /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
          /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

    - name: Restore BuildStream CAS
      uses: actions/cache@v4
      with:
        path: ~/.cache/buildstream
        # Documentation/wrapper edits do not change package artifacts.
        key: buildstream-zlib-v1-${{ runner.os }}-${{ hashFiles('project.conf', 'buildstream/elements/**') }}
        restore-keys: |
          buildstream-zlib-v1-${{ runner.os }}-

    - name: Restore pinned BuildStream tools
      uses: actions/cache@v4
      with:
        path: ~/.cache/imagefs-buildstream/tools
        key: buildstream-tools-v3-${{ runner.os }}-bst-2.7.0-core-plugins-2.7.0-community-2.3.1-buildbox-1.4.15

    - name: Install pinned BuildStream tools
      run: bash ci/setup/install-buildstream.sh

    - name: Build isolated package artifacts
      run: |
        elements=(
          compress/zlib.bst
          compress/zstd.bst
          android/libcxx-shared.bst
          android/android-sysvshm.bst
          android/android-spawn.bst
          android/android-sysv-semaphore.bst
          android/libandroid-shmem.bst
          graphics/vulkan-headers.bst
          text/libffi.bst
          tests/autotools-sysroot-smoke.bst
        )
        buildstream/bst build "${elements[@]}"
        for element in "${elements[@]}"; do
          buildstream/bst show --deps none "$element" \
            --format '%{state} %{full-key}'
          test "$(buildstream/bst show --deps none "$element" \
            --format '%{state}')" = cached
        done

    - name: Checkout and verify artifacts
      run: |
        rm -rf artifacts/buildstream-*
        buildstream/bst artifact checkout compress/zlib.bst \
          --deps none \
          --directory artifacts/buildstream-zlib
        buildstream/bst artifact checkout compress/zstd.bst \
          --deps none \
          --directory artifacts/buildstream-zstd
        for element in libcxx-shared android-sysvshm android-spawn android-sysv-semaphore libandroid-shmem; do
          buildstream/bst artifact checkout "android/$element.bst" \
            --deps none \
            --directory "artifacts/buildstream-$element"
        done
        buildstream/bst artifact checkout graphics/vulkan-headers.bst \
          --deps none \
          --directory artifacts/buildstream-vulkan-headers
        buildstream/bst artifact checkout text/libffi.bst \
          --deps none \
          --directory artifacts/buildstream-libffi

        test -L artifacts/buildstream-zlib/usr/lib/libz.so
        test -L artifacts/buildstream-zlib/usr/lib/libz.so.1
        test -f artifacts/buildstream-zlib/usr/include/zlib.h
        readelf -dW artifacts/buildstream-zlib/usr/lib/libz.so.1.3.1 |
          grep -q 'SONAME.*libz.so.1'
        test -L artifacts/buildstream-zstd/usr/lib/libzstd.so
        test -L artifacts/buildstream-zstd/usr/lib/libzstd.so.1
        test -f artifacts/buildstream-zstd/usr/include/zstd.h
        readelf -dW artifacts/buildstream-zstd/usr/lib/libzstd.so.1.5.6 |
          grep -q 'SONAME.*libzstd.so.1'
        for symbol in ZSTD_compress ZSTD_decompress ZSTD_versionNumber; do
          readelf -Ws artifacts/buildstream-zstd/usr/lib/libzstd.so.1.5.6 |
            grep -q "GLOBAL.* $symbol$"
        done
        test ! -e artifacts/buildstream-zlib/opt/android-ndk
        test ! -e artifacts/buildstream-zstd/opt/android-ndk

        test -f artifacts/buildstream-libcxx-shared/usr/lib/libc++_shared.so
        readelf -dW artifacts/buildstream-libcxx-shared/usr/lib/libc++_shared.so |
          grep -q 'SONAME.*libc++_shared.so'

        sysv=artifacts/buildstream-android-sysvshm/usr/lib/libandroid-sysvshm.so
        test -L artifacts/buildstream-android-sysvshm/usr/lib/libsysvshm.so
        for symbol in shmget shmat shmdt shmctl \
          libandroid_shmget libandroid_shmat libandroid_shmdt libandroid_shmctl; do
          readelf -Ws "$sysv" | grep -q "GLOBAL.* $symbol$"
        done

        spawn=artifacts/buildstream-android-spawn/usr/lib/libandroid-spawn.so
        for symbol in posix_spawn posix_spawnp glob globfree; do
          readelf -Ws "$spawn" | grep -q "GLOBAL.* $symbol$"
        done
        test -f artifacts/buildstream-android-spawn/usr/include/spawn.h

        semaphore=artifacts/buildstream-android-sysv-semaphore/usr/lib/libandroid-sysv-semaphore.so
        for symbol in semget semop semctl semtimedop; do
          readelf -Ws "$semaphore" | grep -q "GLOBAL.* $symbol$"
        done

        shmem=artifacts/buildstream-libandroid-shmem/usr/lib/libandroid-shmem.so
        readelf -dW "$shmem" | grep -q 'SONAME.*libandroid-shmem.so'
        for symbol in libandroid_shmget libandroid_shmat libandroid_shmdt libandroid_shmctl; do
          readelf -Ws "$shmem" | grep -q "GLOBAL.* $symbol$"
        done
        test ! -e artifacts/buildstream-libandroid-shmem/usr/include/sys/shm.h

        test -f artifacts/buildstream-vulkan-headers/usr/include/vulkan/vulkan.h
        test -f artifacts/buildstream-vulkan-headers/usr/include/vk_video/vulkan_video_codecs_common.h
        test -f artifacts/buildstream-vulkan-headers/usr/share/vulkan/registry/vk.xml

        ffi=artifacts/buildstream-libffi/usr/lib/libffi.so.8.1.4
        test -f "$ffi"
        readelf -dW "$ffi" | grep -q 'SONAME.*libffi.so.8'
        for symbol in ffi_call ffi_prep_cif ffi_prep_closure_loc; do
          readelf -Ws "$ffi" | grep -q "GLOBAL.* $symbol"
        done
        test ! -e artifacts/buildstream-libffi/bin/bash
        test ! -e artifacts/buildstream-libffi/opt/android-ndk

    - uses: actions/upload-artifact@v4
      with:
        name: buildstream-package-artifacts
        path: artifacts/buildstream-*
        if-no-files-found: error
        retention-days: 7
