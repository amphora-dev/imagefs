# Build imagefs.txz → Release tag `amphora` → content_manifest.rootfs
# Contracts: ci/README.md
name: build-imagefs

# Auto: only graph inputs. Docs / ci plumbing / box64 → workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Refresh Release amphora even if SHA matches published asset"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "vendor/mesa-gl-patches/**"
      - "*.sh"
      - ".github/workflows/build-imagefs.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "vendor/mesa-gl-patches/**"
      - "*.sh"
      - ".github/workflows/build-imagefs.yml"

permissions:
  contents: write

env:
  # Paths must match cache steps + package-imagefs/verify defaults in CI.
  BUILD_DIR: /tmp/imagefs-build
  OUTPUT_DIR: /tmp/imagefs-output
  CCACHE_DIR: /tmp/imagefs-build/cache/ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ndk-build
        with:
          deps: graph

      - uses: actions/cache@v4
        with:
          path: |
            /tmp/imagefs-build/cache/*.tar*
            /tmp/imagefs-build/src
            /tmp/imagefs-build/built-pkgs
            /tmp/imagefs-build/staging
            /tmp/imagefs-build/host
          key: imagefs-pkgs-${{ runner.os }}-${{ hashFiles('packages/**', 'vendor/winlator-bionic/**', 'vendor/mesa-gl-patches/**', 'lib/**', 'build-all.sh', 'config.sh', 'create-rootfs.sh', 'package-imagefs.sh', 'setup-env.sh') }}
          restore-keys: |
            imagefs-pkgs-${{ runner.os }}-

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            imagefs-ccache-${{ runner.os }}-

      - run: bash ci/verify/pkg-selftest.sh
      - run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR" "$CCACHE_DIR" artifacts
          ./build-all.sh
      - if: always()
        run: ccache -s || true
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify artifact
        run: bash ci/verify/imagefs-artifact.sh

      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: bash ci/gate/imagefs-publish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: imagefs
          path: artifacts/imagefs.txz*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release amphora
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.sha }}
        run: |
          BODY=$(cat <<EOF
          Self-built Bionic imagefs (fixed tag \`amphora\`).
          Commit: \`${{ github.sha }}\`
          SHA-256: \`${{ steps.publish.outputs.sha }}\`
          Box64 ships on Release tag \`box64\`.
          EOF
          )
          bash ci/publish/fixed-release.sh \
            --tag amphora \
            --title amphora \
            --body "$BODY" \
            --latest \
            -- artifacts/imagefs.txz artifacts/imagefs.txz.sha256sum

      - name: Pin content_manifest rootfs
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/bump-manifest
        with:
          component: rootfs
          sha256: ${{ steps.publish.outputs.sha }}
          size: ${{ steps.publish.outputs.size }}
          token: ${{ secrets.AMPHORA_REPO_TOKEN }}
