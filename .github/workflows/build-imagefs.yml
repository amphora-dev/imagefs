# =============================================================================
# Build winlator bionic imagefs and publish Release artifacts.
# Runs natively on ubuntu-latest (runner NDK + apt tools). No Docker.
# =============================================================================

name: build-imagefs

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/imagefs-build
  OUTPUT_DIR: /tmp/imagefs-output
  JOBS: "4"
  CCACHE_DIR: /tmp/imagefs-build/cache/ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            autoconf automake libtool libtool-bin autotools-dev pkg-config \
            perl python3 python3-pip python3-setuptools python3-wheel \
            curl wget git unzip xz-utils tar bzip2 gzip ca-certificates \
            patch file rsync binutils gperf flex bison gettext texinfo \
            patchelf ccache
          sudo pip3 install --no-cache-dir "meson>=1.3"

      - name: Resolve runner NDK
        run: |
          set -euo pipefail
          pick=""
          for cand in \
            "${ANDROID_NDK_LATEST_HOME:-}" \
            "${ANDROID_NDK_HOME:-}" \
            "${ANDROID_NDK_ROOT:-}" \
            "${ANDROID_NDK:-}"; do
            if [ -n "$cand" ] && [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
              pick="$cand"
              break
            fi
          done
          if [ -z "$pick" ] && [ -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" ]; then
            pick="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/29.* 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$pick" ]; then
              pick="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
            fi
          fi
          if [ -z "$pick" ] || [ ! -x "$pick/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "FAIL: no usable NDK on runner" >&2
            ls -la "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" 2>/dev/null || true
            exit 1
          fi
          echo "Using runner NDK: $pick"
          echo "ANDROID_NDK_HOME=$pick" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$pick" >> "$GITHUB_ENV"

      - name: Restore package caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/imagefs-build/cache/*.tar*
            /tmp/imagefs-build/src
            /tmp/imagefs-build/built-pkgs
            /tmp/imagefs-build/staging
            /tmp/imagefs-build/host
          key: imagefs-pkgs-${{ runner.os }}-${{ hashFiles('packages/**', 'vendor/**', 'lib/**', 'build-all.sh', 'config.sh', 'create-rootfs.sh', 'package-imagefs.sh', 'setup-env.sh') }}
          restore-keys: |
            imagefs-pkgs-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            imagefs-ccache-${{ runner.os }}-

      - name: Package helper selftest
        run: bash ci/pkg-selftest.sh

      - name: Build imagefs
        run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR" "$CCACHE_DIR" artifacts
          ./build-all.sh

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify key artifacts
        run: |
          test -f "$OUTPUT_DIR/imagefs.txz"
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/bin/box64$'; then
            echo "FAIL: box64 in imagefs.txz" >&2
            exit 1
          fi
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/include/'; then
            echo "FAIL: usr/include in imagefs.txz" >&2
            exit 1
          fi
          ls -lh "$OUTPUT_DIR/"

      - name: Verify Wine dependency sonames
        run: |
          export IMAGEFS_RUNTIME_STAGE="$BUILD_DIR/target"
          bash ci/verify-wine-deps.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp "$OUTPUT_DIR/imagefs.txz" artifacts/
          cp "$OUTPUT_DIR/imagefs.txz.sha256sum" artifacts/
          ls -lh artifacts/
          cat artifacts/imagefs.txz.sha256sum

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imagefs
          path: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          if-no-files-found: error
          retention-days: 14

      - name: Publish amphora Release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amphora
          name: amphora
          body: |
            Self-built Bionic imagefs (fixed tag — overwritten on every main build).

            ALSA-only audio path; Box64 via WCP. Wine sonames asserted by
            `ci/verify-wine-deps.sh`.
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
          make_latest: true

      # Push rootfs pin into amphora-dev/content_manifest so devices pick it up
      # via the remote content_manifest.json (no APK rebuild / no amphora CI).
      - name: Update content_manifest rootfs pin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AMPHORA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "WARN: AMPHORA_REPO_TOKEN not set; skip content_manifest pin update" >&2
            exit 0
          fi
          SHA="$(awk '{print $1}' artifacts/imagefs.txz.sha256sum)"
          SIZE="$(stat -c%s artifacts/imagefs.txz)"
          WORK="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/amphora-dev/content_manifest.git" "$WORK/content_manifest"
          MANIFEST="$WORK/content_manifest/content_manifest.json"
          test -f "$MANIFEST"
          python3 - "$MANIFEST" "$SHA" "$SIZE" <<'PY'
          import json, sys
          path, sha, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          rootfs = data["components"]["rootfs"]
          old_sha = rootfs.get("sha256")
          old_ver = int(str(rootfs.get("version", "0")))
          if old_sha == sha and int(rootfs.get("size") or 0) == size:
              print("rootfs pin already up to date; nothing to commit")
              open("/tmp/content-manifest-pin-skip", "w").write("1")
              raise SystemExit(0)
          rootfs["sha256"] = sha
          rootfs["size"] = size
          rootfs["version"] = str(old_ver + 1)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(f"bumped rootfs pin v{old_ver} -> v{old_ver + 1} sha={sha} size={size}")
          PY
          if [ -f /tmp/content-manifest-pin-skip ]; then
            exit 0
          fi
          cd "$WORK/content_manifest"
          git config user.name "imagefs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_manifest.json
          NEW_VER="$(python3 -c 'import json;print(json.load(open("content_manifest.json"))["components"]["rootfs"]["version"])')"
          git commit -m "$(cat <<EOF
          chore: pin imagefs rootfs v${NEW_VER}

          Published by amphora-dev/imagefs CI after Release amphora refresh.
          EOF
          )"
          git push origin HEAD:main

      - name: Publish tagged Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: winlator bionic imagefs build artifacts
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
