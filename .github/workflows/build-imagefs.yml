# Build winlator bionic imagefs and publish Release artifacts.
# Path-gated: only rootfs-affecting paths trigger a rebuild.

name: build-imagefs

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Refresh Release amphora even if imagefs.txz SHA matches published asset"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "build-all.sh"
      - "config.sh"
      - "setup-env.sh"
      - "create-rootfs.sh"
      - "package-imagefs.sh"
      - "ci/pkg-selftest.sh"
      - "ci/verify-wine-deps.sh"
      - "ci/install-build-deps.sh"
      - "ci/resolve-runner-ndk.sh"
      - "ci/bump-content-manifest.sh"
      - ".github/workflows/build-imagefs.yml"
    tags:
      - "imagefs-*"
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "build-all.sh"
      - "config.sh"
      - "setup-env.sh"
      - "create-rootfs.sh"
      - "package-imagefs.sh"
      - "ci/pkg-selftest.sh"
      - "ci/verify-wine-deps.sh"
      - "ci/install-build-deps.sh"
      - "ci/resolve-runner-ndk.sh"
      - "ci/bump-content-manifest.sh"
      - ".github/workflows/build-imagefs.yml"

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/imagefs-build
  OUTPUT_DIR: /tmp/imagefs-output
  JOBS: "4"
  CCACHE_DIR: /tmp/imagefs-build/cache/ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: bash ci/install-build-deps.sh full

      - name: Resolve runner NDK
        run: bash ci/resolve-runner-ndk.sh

      - name: Restore package caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/imagefs-build/cache/*.tar*
            /tmp/imagefs-build/src
            /tmp/imagefs-build/built-pkgs
            /tmp/imagefs-build/staging
            /tmp/imagefs-build/host
          key: imagefs-pkgs-${{ runner.os }}-${{ hashFiles('packages/**', 'vendor/**', 'lib/**', 'build-all.sh', 'config.sh', 'create-rootfs.sh', 'package-imagefs.sh', 'setup-env.sh') }}
          restore-keys: |
            imagefs-pkgs-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            imagefs-ccache-${{ runner.os }}-

      - name: Package helper selftest
        run: bash ci/pkg-selftest.sh

      - name: Build imagefs
        run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR" "$CCACHE_DIR" artifacts
          ./build-all.sh

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify key artifacts
        run: |
          test -f "$OUTPUT_DIR/imagefs.txz"
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/bin/box64$'; then
            echo "FAIL: box64 in imagefs.txz" >&2
            exit 1
          fi
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/include/'; then
            echo "FAIL: usr/include in imagefs.txz" >&2
            exit 1
          fi
          ls -lh "$OUTPUT_DIR/"

      - name: Verify Wine dependency sonames
        run: |
          export IMAGEFS_RUNTIME_STAGE="$BUILD_DIR/target"
          bash ci/verify-wine-deps.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp "$OUTPUT_DIR/imagefs.txz" artifacts/
          cp "$OUTPUT_DIR/imagefs.txz.sha256sum" artifacts/
          ls -lh artifacts/
          cat artifacts/imagefs.txz.sha256sum

      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' artifacts/imagefs.txz.sha256sum)"
          SIZE="$(stat -c%s artifacts/imagefs.txz)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUB=""
          if gh release view amphora --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download amphora --repo "${{ github.repository }}" \
              --pattern 'imagefs.txz.sha256sum' --dir /tmp/amphora-rel || true
            if [ -f /tmp/amphora-rel/imagefs.txz.sha256sum ]; then
              PUB="$(awk '{print $1}' /tmp/amphora-rel/imagefs.txz.sha256sum)"
            fi
          fi
          if [ "$FORCE" = "true" ] || [ -z "$PUB" ] || [ "$PUB" != "$SHA" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "SHA matches published amphora ($SHA) — skip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: imagefs
          path: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          if-no-files-found: error
          retention-days: 14

      - name: Publish amphora Release (main)
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amphora
          name: amphora
          body: |
            Self-built Bionic imagefs (fixed tag — refreshed only when rootfs content changes).

            Box64 is separate: Release tag `box64` / workflow `build-box64`.
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
          make_latest: true

      - name: Update content_manifest rootfs pin
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AMPHORA_REPO_TOKEN }}
          COMPONENT: rootfs
          SHA256: ${{ steps.publish.outputs.sha }}
          SIZE: ${{ steps.publish.outputs.size }}
        run: bash ci/bump-content-manifest.sh

      - name: Publish tagged Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: winlator bionic imagefs build artifacts
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
