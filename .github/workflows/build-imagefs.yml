# =============================================================================
# Build winlator bionic imagefs and publish Release artifacts.
# CI/CD: GitHub Actions only.
#
# Triggers:
#   push to main      — full build; overwrite fixed tag Release `amphora`
#   pull_request      — build + verify only (no release)
#   push tags         — full build; create Release named after the tag
#
# Cache:
#   - Docker CI image (gha layer cache; context = ci/ only)
#   - src + built-pkgs + imagefs tree (actions/cache) — NDK 用 runner 自带的
#   - ccache object cache
# =============================================================================

name: build-imagefs

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/imagefs-build
  OUTPUT_DIR: /tmp/imagefs-output
  JOBS: "4"
  CI_IMAGE: imagefs-ci:local
  CCACHE_DIR: /tmp/imagefs-build/cache/ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runner NDK
        id: ndk
        run: |
          set -euo pipefail
          pick=""
          for cand in \
            "${ANDROID_NDK_LATEST_HOME:-}" \
            "${ANDROID_NDK_HOME:-}" \
            "${ANDROID_NDK_ROOT:-}" \
            "${ANDROID_NDK:-}"; do
            if [ -n "$cand" ] && [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
              pick="$cand"
              break
            fi
          done
          if [ -z "$pick" ] && [ -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" ]; then
            pick="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/29.* 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$pick" ]; then
              pick="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
            fi
          fi
          if [ -z "$pick" ] || [ ! -x "$pick/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "FAIL: no usable NDK on runner (expected ANDROID_NDK_LATEST_HOME)" >&2
            ls -la "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" 2>/dev/null || true
            exit 1
          fi
          echo "Using runner NDK: $pick"
          echo "NDK_HOST=$pick" >> "$GITHUB_ENV"
          echo "path=$pick" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile
          load: true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha,scope=imagefs-ci
          cache-to: type=gha,mode=max,scope=imagefs-ci

      - name: Restore package caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/imagefs-build/cache/*.tar*
            /tmp/imagefs-build/src
            /tmp/imagefs-build/built-pkgs
            /tmp/imagefs-build/imagefs
          key: imagefs-pkgs-${{ runner.os }}-${{ hashFiles('packages/**', 'vendor/**', 'build-all.sh', 'config.sh', 'create-rootfs.sh', 'package-imagefs.sh', 'setup-env.sh') }}
          restore-keys: |
            imagefs-pkgs-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ hashFiles('ci/Dockerfile') }}-${{ github.run_id }}
          restore-keys: |
            imagefs-ccache-${{ runner.os }}-${{ hashFiles('ci/Dockerfile') }}-
            imagefs-ccache-${{ runner.os }}-

      - name: Build imagefs
        run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR" "$CCACHE_DIR" artifacts
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$BUILD_DIR:$BUILD_DIR" \
            -v "$OUTPUT_DIR:$OUTPUT_DIR" \
            -v "$NDK_HOST:$NDK_HOST:ro" \
            -e BUILD_DIR \
            -e OUTPUT_DIR \
            -e JOBS \
            -e CCACHE_DIR \
            -e CCACHE_MAXSIZE \
            -e "ANDROID_NDK_HOME=$NDK_HOST" \
            -e "ANDROID_NDK_ROOT=$NDK_HOST" \
            -w /workspace \
            "$CI_IMAGE" \
            ./build-all.sh

      - name: ccache stats
        if: always()
        run: |
          docker run --rm \
            -v "$BUILD_DIR:$BUILD_DIR" \
            -e CCACHE_DIR \
            "$CI_IMAGE" \
            ccache -s || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/imagefs-build/cache/ccache
          key: imagefs-ccache-${{ runner.os }}-${{ hashFiles('ci/Dockerfile') }}-${{ github.run_id }}

      - name: Verify key artifacts
        run: |
          test -f "$OUTPUT_DIR/imagefs.txz"
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/bin/box64$'; then
            echo "FAIL: box64 in imagefs.txz" >&2
            exit 1
          fi
          if tar -tJf "$OUTPUT_DIR/imagefs.txz" | grep -E '^(\./)?usr/include/'; then
            echo "FAIL: usr/include in imagefs.txz" >&2
            exit 1
          fi
          ls -lh "$OUTPUT_DIR/"

      - name: Verify Wine dependency sonames
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$BUILD_DIR:$BUILD_DIR" \
            -v "$OUTPUT_DIR:$OUTPUT_DIR" \
            -e BUILD_DIR \
            -e OUTPUT_DIR \
            -e IMAGEFS_RUNTIME_STAGE=$BUILD_DIR/imagefs-runtime-stage \
            -w /workspace \
            "$CI_IMAGE" \
            bash ci/verify-wine-deps.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp "$OUTPUT_DIR/imagefs.txz" artifacts/
          cp "$OUTPUT_DIR/imagefs.txz.sha256sum" artifacts/
          ls -lh artifacts/
          cat artifacts/imagefs.txz.sha256sum

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imagefs
          path: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          if-no-files-found: error
          retention-days: 14

      - name: Publish amphora Release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amphora
          name: amphora
          body: |
            Self-built Bionic imagefs (fixed tag — overwritten on every main build).

            ALSA-only audio path; Box64 via WCP. Wine sonames asserted by
            `ci/verify-wine-deps.sh`.
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish tagged Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: winlator bionic imagefs build artifacts
          files: |
            artifacts/imagefs.txz
            artifacts/imagefs.txz.sha256sum
          fail_on_unmatched_files: true
