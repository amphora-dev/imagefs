# Build imagefs.txz → Release tag `amphora` → content_manifest.rootfs
# Contracts: ci/README.md
name: build-imagefs

# Auto: only graph inputs. Docs / ci plumbing / box64 → workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Refresh Release amphora even if SHA matches published asset"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "vendor/mesa-gl-patches/**"
      - "vendor/wrapper-patches/**"
      - "vendor/zstd-patches/**"
      - "buildstream/**"
      - "project.conf"
      - "ci/buildstream/**"
      - "*.sh"
      - "ci/verify/**"
      - "ci/gate/imagefs-publish.sh"
      - ".github/workflows/build-imagefs.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "lib/**"
      - "vendor/winlator-bionic/**"
      - "vendor/mesa-gl-patches/**"
      - "vendor/wrapper-patches/**"
      - "vendor/zstd-patches/**"
      - "buildstream/**"
      - "project.conf"
      - "ci/buildstream/**"
      - "*.sh"
      - "ci/verify/**"
      - "ci/gate/imagefs-publish.sh"
      - ".github/workflows/build-imagefs.yml"

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/imagefs-build
  OUTPUT_DIR: /tmp/imagefs-output

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install BuildStream sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-profiles apparmor-utils bubblewrap fuse3 lzip patch \
            python3-venv xz-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Restore BuildStream CAS
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: buildstream-imagefs-v1-${{ runner.os }}-${{ hashFiles('project.conf', 'buildstream/elements/**', 'buildstream/files/**') }}
          restore-keys: |
            buildstream-imagefs-v1-${{ runner.os }}-

      - name: Restore pinned BuildStream tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/imagefs-buildstream/tools
          key: buildstream-tools-v3-${{ runner.os }}-bst-2.7.0-core-plugins-2.7.0-community-2.3.1-buildbox-1.4.15

      - name: Install pinned BuildStream tools
        run: bash ci/setup/install-buildstream.sh

      - run: bash ci/verify/pkg-selftest.sh

      - name: Build imagefs with BuildStream
        run: |
          rm -rf "$BUILD_DIR" "$OUTPUT_DIR" artifacts /tmp/buildstream-imagefs-package
          mkdir -p "$BUILD_DIR/staging" "$OUTPUT_DIR" artifacts
          buildstream/bst build imagefs/package.bst
          buildstream/bst artifact checkout imagefs/package.bst \
            --deps none \
            --directory /tmp/buildstream-imagefs-package
          cp /tmp/buildstream-imagefs-package/artifacts/imagefs.txz* \
            "$OUTPUT_DIR/"
          tar -xJf "$OUTPUT_DIR/imagefs.txz" -C "$BUILD_DIR/staging"

      - name: Verify artifact
        env:
          IMAGEFS_RUNTIME_STAGE: /tmp/imagefs-build/staging
        run: bash ci/verify/imagefs-artifact.sh

      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: bash ci/gate/imagefs-publish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: imagefs
          path: artifacts/imagefs.txz*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release amphora
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.sha }}
        run: |
          BODY=$(cat <<EOF
          Self-built Bionic imagefs (fixed tag \`amphora\`).
          Commit: \`${{ github.sha }}\`
          SHA-256: \`${{ steps.publish.outputs.sha }}\`
          Box64 ships on Release tag \`box64\`.
          EOF
          )
          bash ci/publish/fixed-release.sh \
            --tag amphora \
            --title amphora \
            --body "$BODY" \
            --latest \
            -- artifacts/imagefs.txz artifacts/imagefs.txz.sha256sum

      - name: Pin content_manifest rootfs
        if: steps.publish.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/bump-manifest
        with:
          component: rootfs
          sha256: ${{ steps.publish.outputs.sha }}
          size: ${{ steps.publish.outputs.size }}
          token: ${{ secrets.AMPHORA_REPO_TOKEN }}
