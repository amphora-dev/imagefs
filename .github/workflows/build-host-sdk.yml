name: build-host-sdk

on:
  workflow_dispatch:
  push:
    paths:
    - "ci/buildstream/**"
    - ".github/workflows/build-host-sdk.yml"
  pull_request:
    branches: [main]
    paths:
    - "ci/buildstream/**"
    - ".github/workflows/build-host-sdk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install rootfs generator dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          apparmor-profiles apparmor-utils bubblewrap xz-utils
        sudo install -m 0644 \
          /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
          /etc/apparmor.d/bwrap-userns-restrict
        sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

    - uses: actions/cache@v4
      with:
        path: ~/.cache/imagefs-host-sdk
        key: imagefs-host-sdk-base-ubuntu-24.04.4-amd64

    - name: Build pinned host SDK
      env:
        OUTPUT_DIR: ${{ github.workspace }}/artifacts
      run: bash ci/buildstream/build-host-sdk.sh

    - name: Verify host SDK
      run: |
        sha256sum -c artifacts/imagefs-host-sdk-noble-amd64.tar.xz.sha256
        tar -tJf artifacts/imagefs-host-sdk-noble-amd64.tar.xz >/dev/null
        tar -xOJf artifacts/imagefs-host-sdk-noble-amd64.tar.xz \
          ./usr/share/imagefs-host-sdk/dpkg-manifest.txt |
          grep -q $'^gcc\t'
        tar -xOJf artifacts/imagefs-host-sdk-noble-amd64.tar.xz \
          ./usr/share/imagefs-host-sdk/dpkg-manifest.txt |
          grep -q $'^meson\t'

    - uses: actions/upload-artifact@v4
      with:
        name: imagefs-host-sdk
        path: artifacts/imagefs-host-sdk-*
        if-no-files-found: error
        retention-days: 14

    - name: Publish fixed host SDK Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TARGET_REF: ${{ github.sha }}
      run: |
        sha=$(cut -d' ' -f1 artifacts/imagefs-host-sdk-noble-amd64.tar.xz.sha256)
        body=$(cat <<EOF
        Pinned BuildStream host SDK generated from Ubuntu Base 24.04.4.
        Commit: \`${{ github.sha }}\`
        SHA-256: \`$sha\`
        Package manifest is attached.
        EOF
        )
        bash ci/publish/fixed-release.sh \
          --tag buildstream-host-sdk \
          --title buildstream-host-sdk \
          --body "$body" \
          -- \
          artifacts/imagefs-host-sdk-noble-amd64.tar.xz \
          artifacts/imagefs-host-sdk-noble-amd64.tar.xz.sha256 \
          artifacts/imagefs-host-sdk-packages.txt
