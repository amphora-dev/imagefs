# Build Box64-*.wcp → Release tag `box64` → content_manifest.box64
# Contracts: ci/README.md
# No schedule — run manually or when Box64 sources change.
name: build-box64

# Auto: only leaf inputs. Shared ci/setup|publish|gate → workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: "Custom ptitSeb/box64 ref (empty = pinned BuildStream source)"
        required: false
        default: ""
      force:
        description: "Build even if this commit was already published"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ci/box64/**"
      - "ci/gate/box64-build.sh"
      - "ci/upstream.sh"
      - "lib/ndk.sh"
      - "lib/util.sh"
      - "vendor/box64-patches/**"
      - "buildstream/elements/l1/box64-wcp.bst"
      - "buildstream/elements/base/host-sdk-autotools.bst"
      - "project.conf"
      - "ci/setup/install-buildstream.sh"
      - ".github/workflows/build-box64.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ndk-build
        with:
          deps: leaf

      - name: Install BuildStream sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-profiles apparmor-utils bubblewrap fuse3 lzip patch \
            python3-venv xz-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: buildstream-box64-v1-${{ runner.os }}-${{ hashFiles('project.conf', 'buildstream/elements/l1/box64-wcp.bst', 'buildstream/elements/base/host-sdk-autotools.bst', 'vendor/box64-patches/**') }}
          restore-keys: |
            buildstream-box64-v1-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/imagefs-buildstream/tools
          key: buildstream-tools-v3-${{ runner.os }}-bst-2.7.0-core-plugins-2.7.0-community-2.3.1-buildbox-1.4.15

      - run: bash ci/setup/install-buildstream.sh

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BOX64_REF_INPUT: ${{ inputs.box64_ref || '' }}
        run: bash ci/gate/box64-build.sh

      - name: Build WCP
        if: steps.gate.outputs.should_build == 'true'
        env:
          BOX64_REF: ${{ steps.gate.outputs.box64_ref }}
        run: |
          if [ -n "${{ inputs.box64_ref || '' }}" ]; then
            bash ci/box64/build-wcp.sh
          else
            rm -rf /tmp/buildstream-box64
            buildstream/bst build l1/box64-wcp.bst
            buildstream/bst artifact checkout l1/box64-wcp.bst \
              --deps none \
              --directory /tmp/buildstream-box64
            mkdir -p artifacts
            cp /tmp/buildstream-box64/artifacts/* artifacts/
          fi
          # shellcheck disable=SC1091
          source artifacts/box64-wcp.env
          {
            echo "WCP_NAME=$WCP_NAME"
            echo "FULL_VERSION=$FULL_VERSION"
            echo "SHA256=$SHA256"
            echo "SIZE=$SIZE"
            echo "COMMIT_FULL=$COMMIT_FULL"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.should_build == 'true'
        with:
          name: box64-wcp
          path: artifacts/Box64-*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release box64
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.sha }}
        run: |
          BODY=$(cat <<EOF
          Box64 \`${{ env.FULL_VERSION }}\`
          https://github.com/ptitSeb/box64/commit/${{ env.COMMIT_FULL }}
          EOF
          )
          bash ci/publish/fixed-release.sh \
            --tag box64 \
            --title box64 \
            --body "$BODY" \
            -- "artifacts/${{ env.WCP_NAME }}" "artifacts/${{ env.WCP_NAME }}.sha256sum"

      - name: Prune old box64 assets
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bash ci/publish/prune-assets.sh \
            --tag box64 \
            --match 'Box64-*' \
            --keep "${{ env.WCP_NAME }}" "${{ env.WCP_NAME }}.sha256sum"

      - name: Pin content_manifest box64
        if: steps.gate.outputs.should_build == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/bump-manifest
        with:
          component: box64
          sha256: ${{ env.SHA256 }}
          size: ${{ env.SIZE }}
          asset_path: ${{ env.WCP_NAME }}
          ver_name: ${{ env.FULL_VERSION }}
          remote_url: https://github.com/${{ github.repository }}/releases/download/box64/${{ env.WCP_NAME }}
          kind: WCP
          content_type: Box64
          token: ${{ secrets.AMPHORA_REPO_TOKEN }}
