name: Setup NDK build
description: Install apt deps (leaf|graph|wrapper) and resolve runner Android NDK
inputs:
  deps:
    description: "ci/setup/install-build-deps.sh mode — leaf (Box64), graph (imagefs), wrapper (mesa ICD)"
    required: false
    default: graph
runs:
  using: composite
  steps:
    - name: Install build deps
      shell: bash
      run: bash ci/setup/install-build-deps.sh "${{ inputs.deps }}"
    - name: Resolve NDK
      shell: bash
      run: bash ci/setup/resolve-runner-ndk.sh
