name: setup-buildstream
description: >-
  Install the pinned BuildStream toolchain and point it at the shared remote
  cache (CAS, element artifacts, source cache, and the action cache behind
  remote-apis-socket used by recc).
inputs:
  remote-cache-token:
    description: Bearer token for the remote cache. Empty means local cache only.
    required: false
    default: ""
runs:
  using: composite
  steps:
  - name: Install sandbox dependencies
    shell: bash
    run: |
      # The runner image's needrestart hook restarts services after a
      # libapparmor upgrade. php8.3-fpm is not running here, so that restart
      # sits until systemd's 90s timeout. List-only mode skips the restart.
      sudo apt-get update
      sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
        apparmor-utils bubblewrap fuse3 lzip patch \
        python3-venv xz-utils
      # Ubuntu 24.04 denies unprivileged user namespaces unless the binary's
      # AppArmor profile grants `userns`. apparmor-profiles 26.04 dropped the
      # extra-profiles/bwrap-userns-restrict file this step used to install,
      # so write the profile here instead of depending on that package.
      sudo tee /etc/apparmor.d/amphora-bwrap >/dev/null <<'EOF'
      abi <abi/4.0>,
      include <tunables/global>

      profile amphora-bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
      }
      EOF
      sudo apparmor_parser -r /etc/apparmor.d/amphora-bwrap

  - uses: actions/cache@v4
    with:
      path: ~/.cache/imagefs-buildstream/tools
      key: buildstream-tools-${{ runner.os }}-${{ hashFiles('ci/setup/install-buildstream.sh') }}

  - name: Install BuildStream
    shell: bash
    run: bash ci/setup/install-buildstream.sh

  - name: Configure remote cache
    shell: bash
    env:
      BST_REMOTE_CACHE_TOKEN: ${{ inputs.remote-cache-token }}
      BST_REMOTE_CACHE_REQUIRED: ${{ github.event_name != 'pull_request' }}
    run: bash ci/setup/configure-remote-cache.sh
