# =============================================================================
# packages/depends.conf — Buildroot-style package dependencies
#
# Format (one package per line):
#   name: dep1 dep2 ...
#
# Recipes live in packages/<category>/<name>.sh (see packages/README.md).
# Empty deps are allowed. build-all.sh topo-sorts and invalidates stamps when a
# dependency's content stamp changes. Keep this in sync with ALL_PACKAGES.
# =============================================================================

zlib:
zstd:
libffi:
libexpat:
libpng: zlib
brotli:

pcre2:
freetype: zlib libpng
libiconv:

fontconfig: freetype libexpat libpng
glib: zlib libffi pcre2 libiconv

android-sysvshm:
libandroid-shmem:
libcxx-shared:

xorgproto:
libxcb: xorgproto
xtrans:
libx11: xorgproto xtrans libxcb android-sysvshm
libxext: libx11 xorgproto
libxfixes: libx11 xorgproto
libxrender: libx11 xorgproto
libxcursor: libx11 libxfixes libxrender
libxi: libx11 libxext libxfixes xorgproto
libxshmfence: xorgproto
libdrm:
vulkan-headers:
# Needs x11/xcb .pc at configure time (BUILD_WSI_*_SUPPORT). Depend on the
# X libs so topo runs after libx11 — otherwise pkg-config fails looking for x11.
vulkan-loader: vulkan-headers libx11 libxcb

openssl: zlib
gmp:
nettle: gmp
gnutls: gmp nettle zlib libiconv

alsa-lib:
alsa-android-aserver: alsa-lib

sdl2: alsa-lib

gstreamer: glib zlib
gst-plugins-base: gstreamer glib zlib

android-spawn:
android-sysv-semaphore:
