# shellcheck shell=bash
# =============================================================================
# packages/packages.conf — imagefs.txz 的包全集（唯一真源）
# =============================================================================
# 被 build-all.sh 与 ci/verify/pkg-selftest.sh 共同 source。以前两边各存一份,
# 结果已经漂移: selftest 那份漏了 mesa-gl, 于是它一直在校验一个不存在的包集。
#
# 这里的顺序只用于 topo 排序的稳定性（同层保持书写顺序）; 真正的构建顺序由
# packages/depends.conf 决定。
# 不构建: box64 (独立 .wcp)、curl、多余 X 扩展、pulseaudio 栈、ffmpeg、libglvnd…
# 取舍依据见 docs/analysis/PACKAGE-SELECTION.md。
# =============================================================================

ALL_PACKAGES=(
    zlib
    zstd
    libffi
    libexpat
    libpng
    brotli

    pcre2
    freetype
    libiconv

    fontconfig
    glib

    android-sysvshm
    libandroid-shmem
    libcxx-shared

    xorgproto
    libxcb
    xtrans
    libx11
    libxext
    libxfixes
    libxrender
    libxcursor
    libxi
    libxshmfence
    libdrm
    vulkan-headers
    vulkan-loader
    mesa-gl

    openssl
    gmp
    nettle
    gnutls

    alsa-lib
    alsa-android-aserver

    sdl2

    gstreamer
    gst-plugins-base

    android-spawn
    android-sysv-semaphore
)
